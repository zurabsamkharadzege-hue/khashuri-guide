      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          const mergedOrgs = Array.isArray(parsed.orgs) && parsed.orgs.length
            ? parsed.orgs.map((savedOrg) => {
                const fresh = INITIAL_ORGS.find((i) => i.id === savedOrg.id);
                if (fresh && (!savedOrg.cover || savedOrg.cover.startsWith("data:image/svg+xml"))) {
                  return Object.assign({}, savedOrg, { cover: fresh.cover });
                }
                return savedOrg;
              })
            : INITIAL_ORGS;
          return Object.assign(createDefaultState(), parsed, { orgs: mergedOrgs });
        } catch (err) {
          return createDefaultState();
        }
      }

      let state = loadState();

      function getFilteredOrgs() {
        const q = state.search.trim().toLowerCase();
        let list = state.orgs.filter((o) => {
          if (state.category !== "all" && o.category !== state.category) return false;
          if (state.district !== "all" && o.district !== state.district) return false;
          if (state.onlyFavs && !state.favorites.includes(o.id)) return false;
          if (q) {
            const hay = `${o.nameRu} ${o.nameGe} ${o.addressRu} ${o.addressGe} ${o.descRu} ${o.descGe}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        if (state.sort === "rating") {
          list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        } else if (state.sort === "reviews") {
          list.sort((a, b) => (b.reviewsCount || 0) - (a.reviewsCount || 0));
        } else {
          list.sort((a, b) => Number(Boolean(b.vip)) - Number(Boolean(a.vip)) || (b.rating || 0) - (a.rating || 0));
        }
        return list;
      }

              <button type="submit" class="btn btn-emerald" style="grid-column:1/-1;">${t("Сохранить изменения", "ცვლილებების შენახვა")}</button>
            </form>

            <h4 style="font-size:13px;font-weight:700;margin-bottom:6px;">${t("Заявки на запись", "ჯავშნის მოთხოვნები")}</h4>
            <div class="list-stack" style="margin-bottom:14px;">
              ${bookingsListHtml || `<p class="muted">${t("Заявок пока нет.", "ჯავშნები ჯერ არ არის.")}</p>`}
            </div>

            <h4 style="font-size:13px;font-weight:700;margin-bottom:6px;">${t("Ответы на отзывы", "პასუხები შეფასებებზე")}</h4>
            <div class="list-stack">
              ${ownerReplyInputs || `<p class="muted">${t("Отзывов для ответа пока нет.", "შეფასებები ჯერ არ არის.")}</p>`}
            </div>
          </div>
        `;

        openModal(`
          <div class="modal-head">
            <h2 class="mtavruli" style="font-size:18px;font-weight:800;">${orgName(org)}</h2>
            <button type="button" class="btn btn-sm" data-action="close-modal">✕</button>
          </div>
          <img class="modal-cover" src="${org.cover || fallbackUrl}" alt="${orgName(org)}" onerror="this.onerror=null;this.src='${fallbackUrl}';" />
          <div class="tabs-inline">
            <button type="button" class="pill ${activeSub === "info" ? "active" : ""}" data-action="org-subtab" data-org-id="${org.id}" data-subtab="info">${t("Инфо и запись", "ინფო და ჯავშანი")}</button>
            <button type="button" class="pill ${activeSub === "reviews" ? "active" : ""}" data-action="org-subtab" data-org-id="${org.id}" data-subtab="reviews">${t("Отзывы", "შეფასებები")} (${(org.reviews || []).length})</button>
            <button type="button" class="pill ${activeSub === "owner" ? "active" : ""}" data-action="org-subtab" data-org-id="${org.id}" data-subtab="owner">🔑 ${t("Владелец (1111)", "მფლობელი (1111)")}</button>
          </div>
          ${activeSub === "reviews" ? reviewsBlock : activeSub === "owner" ? ownerBlock : infoBlock}
        `);
      }

      function openAddBizModal() {
        openModal(`
          <div class="modal-head">
            <h2 class="mtavruli" style="font-size:17px;font-weight:800;">${t("Добавить организацию в Хашури", "ორგანიზაციის დამატება ხაშურში")}</h2>
            <button type="button" class="btn btn-sm" data-action="close-modal">✕</button>
          </div>
          <form id="add-biz-form" class="form-grid">
            <input type="text" class="input" id="new-biz-name-ru" placeholder="${t("Название (RU)", "სახელი (RU)")}" required />
            <input type="text" class="input" id="new-biz-name-ge" placeholder="${t("სახელი (GE)", "სახელი (GE)")}" required />
            <select class="select" id="new-biz-cat">
              <option value="food">${catLabel("food")}</option>
              <option value="hotels">${catLabel("hotels")}</option>
              <option value="health">${catLabel("health")}</option>
              <option value="auto">${catLabel("auto")}</option>
              <option value="market">${catLabel("market")}</option>
            </select>
            <select class="select" id="new-biz-district">
              <option value="center">${districtLabel("center")}</option>
              <option value="station">${districtLabel("station")}</option>
              <option value="surami">${districtLabel("surami")}</option>
              <option value="bypass">${districtLabel("bypass")}</option>
            </select>
            <input type="text" class="input" id="new-biz-addr" placeholder="${t("Адрес в Хашури", "მისამართი ხაშურში")}" required />
            <input type="text" class="input" id="new-biz-phone" placeholder="${t("Телефон (+995 ...)", "ტელეფონი (+995 ...)")}" required />
            <input type="text" class="input" id="new-biz-hours" value="09:00–21:00" placeholder="${t("Часы работы", "სამუშაო საათები")}" />
            <input type="url" class="input" id="new-biz-cover" placeholder="${t("Ссылка на фото (необязательно)", "ფოტოს ბმული (არასავალდებულო)")}" />
            <input type="text" class="input" id="new-biz-desc" placeholder="${t("Краткое описание", "მოკლე აღწერა")}" style="grid-column:1/-1;" />
            <button type="submit" class="btn btn-emerald" style="grid-column:1/-1;">${t("Добавить в каталог", "კატალოგში დამატება")}</button>
          </form>
        `);
      }

      function openAddAdModal() {
        openModal(`
          <div class="modal-head">
            <h2 class="mtavruli" style="font-size:17px;font-weight:800;">${t("Новое объявление", "ახალი განცხადება")}</h2>
            <button type="button" class="btn btn-sm" data-action="close-modal">✕</button>
          </div>
          <form id="add-ad-form" class="form-grid">
            <input type="text" class="input" id="new-ad-rubric" placeholder="${t("Рубрика (Недвижимость, Авто, Услуги)", "კატეგორია")}" required />
            <input type="text" class="input" id="new-ad-price" placeholder="${t("Цена / договорная", "ფასი")}" />
            <input type="text" class="input" id="new-ad-title" placeholder="${t("Заголовок объявления", "სათაური")}" style="grid-column:1/-1;" required />
            <input type="text" class="input" id="new-ad-phone" placeholder="${t("Телефон для связи", "საკონტაქტო ტელეფონი")}" required />
            <textarea class="textarea" id="new-ad-desc" rows="3" placeholder="${t("Подробности...", "დეტალები...")}" style="grid-column:1/-1;"></textarea>
            <button type="submit" class="btn btn-amber" style="grid-column:1/-1;">${t("Опубликовать", "გამოქვეყნება")}</button>
          </form>
        `);
      }

      function openAdminModal() {
        openModal(`
          <div class="modal-head">
            <h2 class="mtavruli" style="font-size:17px;font-weight:800;">${t("Панель администратора (PIN: 2026)", "ადმინისტრატორის პანელი (PIN: 2026)")}</h2>
            <button type="button" class="btn btn-sm" data-action="close-modal">✕</button>
          </div>
          <div id="admin-login-box">
            <p class="muted" style="margin-bottom:8px;">${t("Введите PIN-код 2026 для модерации VIP-заявок и рекламы.", "შეიყვანეთ PIN კოდი 2026 VIP და სარეკლამო განაცხადების სამართავად.")}</p>
            <div style="display:flex;gap:8px;">
              <input type="password" class="input" id="admin-pin-input" placeholder="PIN (2026)" maxlength="6" />
              <button type="button" class="btn btn-amber" data-action="unlock-admin">${t("Войти", "შესვლა")}</button>
            </div>
          </div>
          <div id="admin-dashboard" style="display:none;"></div>
        `);
      }

      function renderAdminDashboard() {
        const box = document.getElementById("admin-dashboard");
        if (!box) return;
        const vipHtml = state.vipRequests.map((req, idx) => `
          <div class="item-row">
            <div>
              <strong>${req.orgName}</strong> — <span class="muted">${t("Запрос VIP-статуса", "VIP სტატუსის მოთხოვნა")}</span>
            </div>
            <button type="button" class="btn btn-emerald btn-sm" data-action="approve-vip" data-org-id="${req.orgId}" data-req-idx="${idx}">
              ${t("Одобрить VIP", "VIP-ის დადასტურება")}
            </button>
          </div>
        `).join("");

        const adsHtml = state.adInquiries.map((inq) => `
          <div class="item-row">
            <div>
              <strong>${inq.bizName}</strong> · ${inq.phone}
              <div class="muted">${inq.pkg}</div>
            </div>
            <span class="badge badge-cat">${t("Заявка", "განაცხადი")}</span>
          </div>
        `).join("");

        box.innerHTML = `
          <h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">${t("Заявки на VIP", "VIP მოთხოვნები")} (${state.vipRequests.length})</h4>
          <div class="list-stack" style="margin-bottom:14px;">
            ${vipHtml || `<p class="muted">${t("Нет активных VIP-заявок.", "აქტიური VIP მოთხოვნები არ არის.")}</p>`}
          </div>
          <h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">${t("Заявки на рекламу", "სარეკლამო განაცხადები")} (${state.adInquiries.length})</h4>
          <div class="list-stack">
            ${adsHtml || `<p class="muted">${t("Заявок на рекламу пока нет.", "სარეკლამო განაცხადები ჯერ არ არის.")}</p>`}
          </div>
        `;
      }

      document.addEventListener("click", (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) {
          if (e.target.id === "modal-backdrop") closeModal();
          return;
        }

        const action = target.dataset.action;

        if (action === "set-lang") {
          state.lang = target.dataset.lang === "ge" ? "ge" : "ru";
          saveState();
          render();
          return;
        }

        if (action === "set-tab") {
          state.tab = target.dataset.tab || "catalog";
          saveState();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }

        if (action === "set-category") {
          state.category = target.dataset.cat || "all";
          render();
          return;
        }

        if (action === "set-district") {
          state.district = target.dataset.district || "all";
          render();
          return;
        }

        if (action === "toggle-only-favs") {
          state.onlyFavs = !state.onlyFavs;
          render();
          return;
        }

        if (action === "toggle-fav") {
          e.stopPropagation();
          const id = target.dataset.orgId;
          if (!id) return;
          const idx = state.favorites.indexOf(id);
          if (idx >= 0) state.favorites.splice(idx, 1);
          else state.favorites.push(id);
          saveState();
          render();
          if (document.getElementById("modal-backdrop").classList.contains("open")) {
            openOrgModal(id, "info");
          }
          showToast(t("Избранное обновлено", "რჩეულები განახლდა"));
          return;
        }

        if (action === "track-click") {
          const id = target.dataset.orgId;
          const org = state.orgs.find((o) => o.id === id);
          if (org) {
            org.clicks = (org.clicks || 0) + 1;
            saveState();
          }
          return;
        }

        if (action === "open-org") {
          openOrgModal(target.dataset.orgId, "info");
          return;
        }

        if (action === "org-subtab") {
          openOrgModal(target.dataset.orgId, target.dataset.subtab || "info");
          return;
        }

        if (action === "select-pin") {
          state.selectedPinId = target.dataset.orgId;
          saveState();
          render();
          return;
        }

        if (action === "open-add-biz") {
          openAddBizModal();
          return;
        }

        if (action === "open-add-ad") {
          openAddAdModal();
          return;
        }

        if (action === "open-admin-modal") {
          openAdminModal();
          return;
        }

        if (action === "close-modal") {
          closeModal();
          return;
        }

        if (action === "unlock-owner") {
          const pin = (document.getElementById("owner-pin-input") || {}).value || "";
          if (pin.trim() === "1111") {
            document.getElementById("owner-auth-box").style.display = "none";
            document.getElementById("owner-dashboard").style.display = "block";
            showToast(t("Кабинет владельца открыт", "კაბინეტი გახსნილია"));
          } else {
            showToast(t("Неверный PIN (нужен 1111)", "არასწორი PIN (საჭიროა 1111)"));
          }
          return;
        }

        if (action === "request-vip") {
          const org = state.orgs.find((o) => o.id === target.dataset.orgId);
          if (!org) return;
          state.vipRequests.push({ orgId: org.id, orgName: orgName(org) });
          saveState();
          updateChrome();
          showToast(t("Заявка на VIP отправлена админу", "VIP მოთხოვნა გაიგზავნა"));
          return;
        }

        if (action === "save-reply") {
          const org = state.orgs.find((o) => o.id === target.dataset.orgId);
          const revIdx = Number(target.dataset.revIdx);
          const input = document.getElementById(`reply-input-${revIdx}`);
          if (org && Array.isArray(org.reviews) && org.reviews[revIdx] && input) {
            org.reviews[revIdx].reply = input.value.trim();
            saveState();
            showToast(t("Ответ сохранён", "პასუხი შენახულია"));
          }
          return;
        }

        if (action === "unlock-admin") {
          const pin = (document.getElementById("admin-pin-input") || {}).value || "";
          if (pin.trim() === "2026") {
            document.getElementById("admin-login-box").style.display = "none";
            document.getElementById("admin-dashboard").style.display = "block";
            renderAdminDashboard();
          } else {
            showToast(t("Неверный PIN (нужен 2026)", "არასწორი PIN (საჭიროა 2026)"));
          }
          return;
        }

        if (action === "approve-vip") {
          const org = state.orgs.find((o) => o.id === target.dataset.orgId);
          const reqIdx = Number(target.dataset.reqIdx);
          if (org) org.vip = true;
          if (!Number.isNaN(reqIdx)) state.vipRequests.splice(reqIdx, 1);
          saveState();
          updateChrome();
          render();
          renderAdminDashboard();
          showToast(t("VIP-статус активирован", "VIP სტატუსი გააქტიურდა"));
          return;
        }

        if (action === "prefill-ad-pkg") {
          const pkgInput = document.getElementById("ad-biz-pkg");
          if (pkgInput) {
            pkgInput.value = target.dataset.pkg || "";
            pkgInput.focus();
            showToast(t("Пакет выбран", "პაკეტი არჩეულია"));
          }
        }
      });

      document.addEventListener("input", (e) => {
        if (e.target && e.target.id === "search-input") {
          state.search = e.target.value;
          const cursor = e.target.selectionStart;
          render();
          const nextInput = document.getElementById("search-input");
          if (nextInput) {
            nextInput.focus();
            if (typeof cursor === "number") nextInput.setSelectionRange(cursor, cursor);
          }
        }
      });

      document.addEventListener("change", (e) => {
        if (e.target && e.target.id === "sort-select") {
          state.sort = e.target.value;
          render();
        }
      });

      document.addEventListener("submit", (e) => {
        const form = e.target;
        if (!form) return;

        if (form.id === "owner-edit-form") {
          e.preventDefault();
          const org = state.orgs.find((o) => o.id === form.dataset.orgId);
          if (!org) return;
          org.nameRu = document.getElementById("owner-edit-name-ru").value.trim() || org.nameRu;
          org.nameGe = document.getElementById("owner-edit-name-ge").value.trim() || org.nameGe;
          const addrVal = document.getElementById("owner-edit-address").value.trim();
          if (addrVal) {
            if (state.lang === "ge") org.addressGe = addrVal;
            else org.addressRu = addrVal;
          }
          org.phone = document.getElementById("owner-edit-phone").value.trim() || org.phone;
          org.hours = document.getElementById("owner-edit-hours").value.trim() || org.hours;
          org.statusOpen = document.getElementById("owner-edit-status").value === "open";
          org.promoRu = document.getElementById("owner-edit-promo-ru").value.trim();
          org.promoGe = document.getElementById("owner-edit-promo-ge").value.trim();
          const coverVal = document.getElementById("owner-edit-cover").value.trim();
          if (coverVal) org.cover = coverVal;
          saveState();
          render();
          showToast(t("Изменения сохранены!", "ცვლილებები შენახულია!"));
          return;
        }

        if (form.id === "booking-form") {
          e.preventDefault();
          const org = state.orgs.find((o) => o.id === form.dataset.orgId);
          if (!org) return;
          org.bookings = org.bookings || [];
          org.bookings.unshift({
            id: "b_" + Date.now(),
            name: document.getElementById("book-name").value.trim(),
            phone: document.getElementById("book-phone").value.trim(),
            time: document.getElementById("book-time").value.trim(),
            note: document.getElementById("book-note").value.trim(),
            status: "new"
          });
          saveState();
          form.reset();
          showToast(t("Заявка отправлена владельцу", "ჯავშანი გაიგზავნა"));
          return;
        }

        if (form.id === "review-form") {
          e.preventDefault();
          const org = state.orgs.find((o) => o.id === form.dataset.orgId);
          if (!org) return;
          const stars = Number(document.getElementById("rev-stars").value || 5);
          const author = document.getElementById("rev-author").value.trim();
          const text = document.getElementById("rev-text").value.trim();
          org.reviews = org.reviews || [];
          org.reviews.unshift({ id: "r_" + Date.now(), author, stars, text, reply: "" });
          const prevTotal = (org.rating || 4.5) * (org.reviewsCount || 1);
          org.reviewsCount = (org.reviewsCount || 0) + 1;
          org.rating = Math.min(5, Number(((prevTotal + stars) / org.reviewsCount).toFixed(1)));
          saveState();
          render();
          openOrgModal(org.id, "reviews");
          showToast(t("Отзыв добавлен", "შეფასება დაემატა"));
          return;
        }

        if (form.id === "add-biz-form") {
          e.preventDefault();
          const nameRu = document.getElementById("new-biz-name-ru").value.trim();
          const nameGe = document.getElementById("new-biz-name-ge").value.trim();
          const cat = document.getElementById("new-biz-cat").value;
          const dist = document.getElementById("new-biz-district").value;
          const addr = document.getElementById("new-biz-addr").value.trim();
          const phone = document.getElementById("new-biz-phone").value.trim();
          const hours = document.getElementById("new-biz-hours").value.trim() || "09:00–21:00";
          const coverInput = document.getElementById("new-biz-cover").value.trim();
          const desc = document.getElementById("new-biz-desc").value.trim() || t("Организация в г. Хашури.", "ორგანიზაცია ხაშურში.");

          state.orgs.unshift({
            id: "biz_" + Date.now(),
            category: cat,
            district: dist,
            vip: false,
            statusOpen: true,
            nameRu,
            nameGe,
            addressRu: addr,
            addressGe: addr,
            phone,
            hours,
            rating: 5.0,
            reviewsCount: 1,
            views: 1,
            clicks: 0,
            mapsUrl: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(nameRu + " Khashuri"),
            descRu: desc,
            descGe: desc,
            promoRu: "",
            promoGe: "",
            pinX: 50,
            pinY: 50,
            cover: coverInput || makeFallbackArt(cat),
            reviews: [],
            bookings: []
          });
          saveState();
          closeModal();
          state.tab = "catalog";
          render();
          showToast(t("Организация добавлена", "ორგანიზაცია დაემატა"));
          return;
        }

        if (form.id === "add-ad-form") {
          e.preventDefault();
          state.userAds.unshift({
            id: "ad_" + Date.now(),
            rubric: document.getElementById("new-ad-rubric").value.trim(),
            price: document.getElementById("new-ad-price").value.trim(),
            title: document.getElementById("new-ad-title").value.trim(),
            phone: document.getElementById("new-ad-phone").value.trim(),
            desc: document.getElementById("new-ad-desc").value.trim()
          });
          saveState();
          closeModal();
          state.tab = "ads";
          render();
          showToast(t("Объявление опубликовано", "განცხადება გამოქვეყნდა"));
          return;
        }

        if (form.id === "ad-inquiry-form") {
          e.preventDefault();
          state.adInquiries.unshift({
            id: "inq_" + Date.now(),
            bizName: document.getElementById("ad-biz-name").value.trim(),
            phone: document.getElementById("ad-biz-phone").value.trim(),
            pkg: document.getElementById("ad-biz-pkg").value.trim()
          });
          saveState();
          updateChrome();
          form.reset();
          showToast(t("Заявка отправлена", "განაცხადი გაიგზავნა"));
        }
      });

      render();
    })();
  </script>
</body>
</html>
"""

file_name = "khashuri-city-guide-index-v2.html"
with open(file_name, "w", encoding="utf-8") as f:
    f.write(html_content)

print("Saved:", file_name, len(html_content))
