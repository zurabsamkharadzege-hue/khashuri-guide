<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Объявления — Khashuri Guide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f5f7;
      color: #1f2937;
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* Сетка карточек */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .card-body {
      padding: 16px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #111827;
    }

    .card-location {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: #111827;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #374151;
    }

    /* Внутреннее окно полного просмотра объявления (без перехода на чужой сайт) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-backdrop.active {
      display: block;
    }

    .modal-box {
      max-width: 820px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      position: relative;
    }

    .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
      clear: both;
    }

    .modal-price {
      font-size: 20px;
      font-weight: bold;
      color: #059669;
      margin-bottom: 16px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .gallery img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 8px;
      background: #e5e7eb;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .full-description {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-line;
      font-size: 14px;
      color: #1f2937;
    }

    .specs-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .specs-list li {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }

    .contacts-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .contact-btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .contact-btn.whatsapp {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Объявления — Хашури и окрестности</h1>
    <div id="listingsGrid" class="listings-grid"></div>
  </div>

  <!-- Модальное окно просмотра объявления внутри сайта -->
  <div id="listingModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal-box">
      <button type="button" class="close-btn" onclick="closeListingModal()">Закрыть ✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // Подставь сюда свои объявления (или загружай их из своего JSON/API)
    const listings = [
      {
        id: "1",
        title: "Дом с участком в Сурами",
        price: "45 000 USD",
        location: "Хашурский муниципалитет, Сурами",
        shortDescription: "Жилой дом рядом с сосновым лесом и ровным участком.",
        fullDescription:
          "Продаётся дом в Сурами в тихом месте рядом с сосновым лесом. Подходит как для постоянного проживания, так и для отдыха или сдачи гостям. Проведены коммуникации, удобный подъезд.",
        images: [
          "https://via.placeholder.com/600x400?text=Foto+1",
          "https://via.placeholder.com/600x400?text=Foto+2"
        ],
        specs: {
          "Площадь дома": "120 м²",
          "Участок": "600 м²",
          "Комнаты": "4",
          "Локация": "Сурами"
        },
        phone: "+995555000000",
        whatsapp: "995555000000"
      }
    ];

    function renderListings() {
      const grid = document.getElementById("listingsGrid");
      grid.innerHTML = "";

      listings.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";

        const firstImg = (item.images && item.images[0]) || "https://via.placeholder.com/600x400?text=No+Photo";

        card.innerHTML = `
          <div>
            <img src="${escapeHtml(firstImg)}" alt="${escapeHtml(item.title)}" />
            <div class="card-body">
              <div class="price">${escapeHtml(item.price || "Цена по запросу")}</div>
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-location">${escapeHtml(item.location || "")}</div>
              <div class="card-desc">${escapeHtml(item.shortDescription || "")}</div>
            </div>
          </div>
          <div class="card-body" style="padding-top: 0;">
            <button type="button" class="btn" onclick="openListingModal('${escapeHtml(item.id)}')">
              Смотреть на сайте
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openListingModal(id) {
      const item = listings.find((x) => String(x.id) === String(id));
      if (!item) return;

      const galleryHtml = (item.images || [])
        .map((src, idx) => `<img src="${escapeHtml(src)}" alt="${escapeHtml(item.title)} — фото ${idx + 1}" />`)
        .join("");

      const specsEntries = Object.entries(item.specs || {});
      const specsHtml = specsEntries.length
        ? `<ul class="specs-list">${specsEntries
            .map(([k, v]) => `<li><strong>${escapeHtml(k)}:</strong> ${escapeHtml(String(v))}</li>`)
            .join("")}</ul>`
        : "<p>Характеристики не указаны.</p>";

      const phoneClean = (item.phone || "").replace(/[^\d+]/g, "");
      const waClean = (item.whatsapp || "").replace(/[^\d]/g, "");

      let contactsHtml = "";
      if (phoneClean) {
        contactsHtml += `<a class="contact-btn" href="tel:${escapeHtml(phoneClean)}">Позвонить: ${escapeHtml(item.phone)}</a>`;
      }
      if (waClean) {
        contactsHtml += `<a class="contact-btn whatsapp" href="https://wa.me/${escapeHtml(waClean)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`;
      }
      if (!contactsHtml) {
        contactsHtml = "<p>Контакты не указаны.</p>";
      }

      document.getElementById("modalContent").innerHTML = `
        <h2 class="modal-title">${escapeHtml(item.title)}</h2>
        <div class="modal-price">${escapeHtml(item.price || "Цена по запросу")}</div>
        ${item.location ? `<p class="card-location">${escapeHtml(item.location)}</p>` : ""}

        <div class="section-title">Фотографии</div>
        <div class="gallery">${galleryHtml || "<p>Фотографии отсутствуют.</p>"}</div>

        <div class="section-title">Полное описание</div>
        <div class="full-description">${escapeHtml(item.fullDescription || item.shortDescription || "Описание отсутствует.")}</div>

        <div class="section-title">Характеристики</div>
        ${specsHtml}

        <div class="contacts-box">${contactsHtml}</div>
      `;

      document.getElementById("listingModal").classList.add("active");
    }

    function closeListingModal() {
      document.getElementById("listingModal").classList.remove("active");
    }

    function closeModalOnBackdrop(event) {
      if (event.target.id === "listingModal") {
        closeListingModal();
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    renderListings();
  </script>
</body>
</html>
